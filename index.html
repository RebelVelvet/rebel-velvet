    <style>
        :root {
            --burgundy: #4A0E17;
            --burgundy-light: #6D1F2B;
            --gold: #C5A059;
            --cream: #FAF6F0;
            --soft-rose: #F3EBE6;
            --text-main: #2C2C2C;
            --text-muted: #666666;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--cream); color: var(--text-main); line-height: 1.6; }

        .top-bar { background: var(--burgundy); color: var(--white); text-align: center; padding: 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }

        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 18px 30px; }
        .logo { font-family: 'Cinzel', serif; font-size: 24px; font-weight: 700; color: var(--burgundy); text-decoration: none; letter-spacing: 2px; text-align: center; }
        .logo span { display: block; font-size: 9px; font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 4px; color: var(--gold); margin-top: -2px; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text-main); font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .nav-links a:hover { color: var(--gold); }
        .nav-icons { display: flex; gap: 20px; align-items: center; }
        .nav-icons a, .cart-icon-btn { color: var(--burgundy); font-size: 18px; cursor: pointer; position: relative; text-decoration: none; background: none; border: none; transition: 0.3s; }
        .nav-icons a:hover { color: var(--gold); }
        .cart-count { position: absolute; top: -8px; right: -10px; background: var(--gold); color: var(--white); font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Professional Interactive Hero Section */
        .hero { position: relative; min-height: 85vh; background: radial-gradient(circle, rgba(250,246,240,1) 0%, rgba(243,235,230,1) 100%); display: flex; align-items: center; overflow: hidden; padding: 40px 0; }
        .hero-container { max-width: 1300px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; padding: 0 30px; align-items: center; gap: 40px; }
        .hero-subtitle { font-family: 'Cinzel', serif; color: var(--gold); font-size: 14px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; }
        .hero-title { font-family: 'Cinzel', serif; font-size: 48px; color: var(--burgundy); line-height: 1.15; margin-bottom: 20px; font-weight: 600; }
        .hero-desc { color: var(--text-muted); font-size: 16px; margin-bottom: 30px; max-width: 500px; }
        .btn-primary { background: var(--burgundy); color: var(--white); border: none; padding: 14px 35px; font-size: 14px; border-radius: 30px; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; box-shadow: 0 4px 20px rgba(74,14,23,0.15); }
        .btn-primary:hover { background: var(--burgundy-light); transform: translateY(-2px); }
        .hero-image-wrap { text-align: center; }
        .hero-image-wrap img { max-width: 100%; height: auto; border-radius: 20px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.08)); }

        /* Quick Category Icons Bar */
        .category-bar { background: var(--white); padding: 25px 0; border-bottom: 1px solid var(--soft-rose); }
        .category-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-around; gap: 20px; flex-wrap: wrap; text-align: center; }
        .cat-badge { text-decoration: none; color: var(--burgundy); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .cat-badge i { font-size: 20px; color: var(--gold); background: var(--soft-rose); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .cat-badge:hover i { background: var(--burgundy); color: var(--white); }

        /* Promo Banner */
        .promo-banner { background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-light) 100%); color: var(--white); padding: 50px 30px; text-align: center; margin: 50px 0; }
        .promo-banner h2 { font-family: 'Cinzel', serif; font-size: 32px; letter-spacing: 2px; margin-bottom: 10px; }
        .promo-banner p { color: var(--soft-rose); font-size: 15px; margin-bottom: 20px; opacity: 0.9; }

        /* Features Ribbon */
        .features-bar { background: var(--burgundy); color: var(--white); padding: 35px 0; }
        .features-container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
        .feature-item { padding: 0 15px; border-right: 1px solid rgba(255,255,255,0.1); }
        .feature-item:last-child { border-right: none; }
        .feature-item i { font-size: 24px; color: var(--gold); margin-bottom: 12px; }
        .feature-item h4 { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 1px; margin-bottom: 5px; }
        .feature-item p { font-size: 12px; color: var(--soft-rose); opacity: 0.8; }

        /* Carousel Section */
        .carousel-section { padding: 50px 0; background: var(--white); border-bottom: 1px solid var(--soft-rose); }
        .carousel-header { text-align: center; margin-bottom: 25px; }
        .carousel-header h3 { font-family: 'Cinzel', serif; font-size: 24px; color: var(--burgundy); }
        .carousel-container { max-width: 1300px; margin: 0 auto; overflow: hidden; position: relative; padding: 0 20px; }
        .carousel-track { display: flex; gap: 20px; transition: transform 0.5s ease-in-out; }
        .carousel-item { min-width: 240px; height: 320px; border-radius: 12px; overflow: hidden; background: var(--soft-rose); position: relative; flex-shrink: 0; }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }
