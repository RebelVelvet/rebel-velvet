<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebel Velvet</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; }
        #products { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; text-align: center; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rebel Velvet Store</h1>
        <div id="products">جاري تحميل المنتجات...</div>
    </div>

    <!-- كود الجافاسكريبت الخاص بتشغيل وعرض المنتجات (الذي يظهر جزء منه في صورتك) -->
    <script>
        const CONFIG = {
            currency: "EGP",
            // ضع هنا رابط الـ Web App الذي تحصل عليه بعد عمل Deploy لكود الـ Google Apps Script بالأعلى:
            catalogApi: "https://script.google.com/macros/s/AKfycbyCFf3T_OP5KcXjgGXpmK9jqGLrP_lDrjsiXkaNXnMF67p_nctuy3qjisghfEUHmGSh/exec"
        };

        let state = {
            products: [],
            drivelimages: {},
            cart: [],
            filter: "all"
        };

        // دالة جلب البيانات وعرضها
        function fetchCatalog() {
            const callbackName = 'rvCb_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
            const script = document.createElement('script');
            
            window[callbackName] = function(data) {
                delete window[callbackName];
                script.remove();
                if (data && data.success) {
                    state.products = data.catalog;
                    renderProducts();
                } else {
                    document.getElementById('products').innerHTML = 'فشل في تحميل البيانات.';
                }
            };
            
            script.src = CONFIG.catalogApi + '?callback=' + callbackName + '&t=' + Date.now();
            document.body.appendChild(script);
        }

        function renderProducts() {
            const grid = document.getElementById('products');
            if (!grid) return;
            
            if (!state.products || state.products.length === 0) {
                grid.innerHTML = '<p>لا توجد منتجات متاحة حالياً.</p>';
                return;
            }

            grid.innerHTML = state.products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p>${p.price} ${CONFIG.currency}</p>
                </div>
            `).join('');
        }

        // تشغيل الجلب عند فتح الصفحة
        window.onload = function() {
            fetchCatalog();
        };
    </script>
</body>
</html>
