<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebel Velvet Store</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f9f9f9; margin: 0; padding: 0; text-align: center; }
        .site-header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        #products { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .product-name { font-size: 16px; color: #333; margin: 10px 0; }
        .product-price { font-size: 14px; color: #6d1f2b; font-weight: bold; }
        .btn { background: #6d1f2b; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #50161f; }
    </style>
</head>
<body>

    <header class="site-header">
        <h2>Rebel Velvet</h2>
        <div>
            <a href="https://wa.me/201092542461" target="_blank" style="margin-left: 15px; text-decoration: none; color: #333;">واتساب</a>
            <a href="https://www.instagram.com/" target="_blank" style="text-decoration: none; color: #333;">انستغرام</a>
        </div>
    </header>

    <div class="container">
        <h1>Find your favorite</h1>
        <div id="products">جاري تحميل المنتجات...</div>
    </div>

    <script>
        const CONFIG = {
            currency: "EGP",
            catalogApi: "https://script.google.com/macros/s/AKfycbyCFf3T_OP5KcXjgGXpmK9jqGLrP_lDrjsiXkaNXnMF67p_nctuy3qjisghfEUHmGSh/exec",
            placeholderImage: "https://placehold.co/800x1000/f1dfd8/6d1f2b?text=Rebel+Velvet"
        };

        let productsList = [];

        async function fetchCatalog() {
            const grid = document.getElementById("products");
            try {
                const response = await fetch(CONFIG.catalogApi);
                const data = await response.json();
                
                if (data && data.success && data.catalog) {
                    productsList = data.catalog;
                    renderProducts();
                } else {
                    grid.innerHTML = '<p>لا توجد منتجات متاحة في الجدول حالياً.</p>';
                }
            } catch (error) {
                console.error("Error fetching catalog:", error);
                grid.innerHTML = '<p>فشل في تحميل البيانات. تحقق من الرابط أو الصلاحيات.</p>';
            }
        }

        function renderProducts() {
            const grid = document.getElementById("products");
            if (!productsList.length) {
                grid.innerHTML = '<p>لا توجد منتجات مطابقة.</p>';
                return;
            }

            grid.innerHTML = productsList.map(product => `
                <article class="product-card">
                    <img src="${product.image || CONFIG.placeholderImage}" alt="${product.name}" />
                    <h3 class="product-name">${product.name}</h3>
                    <p class="product-price">${CONFIG.currency} ${product.price}</p>
                    <button class="btn" onclick="alert('تمت الإضافة إلى السلة: ${product.name}')">Add to bag</button>
                </article>
            `).join("");
        }

        window.onload = fetchCatalog;
    </script>
</body>
</html>
