<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebel Velvet Store</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f9f9f9; margin: 0; padding: 0; text-align: center; }
        .site-header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        #products { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .product-name { font-size: 16px; color: #333; margin: 10px 0; }
        .product-price { font-size: 14px; color: #6d1f2b; font-weight: bold; }
        .btn { background: #6d1f2b; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #50161f; }
    </style>
</head>
<body>

    <header class="site-header">
        <h2>Rebel Velvet</h2>
        <div>
            <a href="https://wa.me/201092542461" target="_blank" style="margin-left: 15px; text-decoration: none; color: #333;">واتساب</a>
            <a href="https://www.instagram.com/" target="_blank" style="text-decoration: none; color: #333;">انستغرام</a>
        </div>
    </header>

    <div class="container">
        <h1>Find your favorite</h1>
        <div id="products">جاري تحميل المنتجات...</div>
    </div>

    <!-- كود الجافاسكريبت مصحح وداخل الوسوم تماماً -->
    <script>
        "use strict";

        const CONFIG = {
            brand: "Rebel Velvet",
            currency: "EGP",
            whatsapp: "201092542461",
            instagram: "https://www.instagram.com/",
            catalogApi: "https://script.google.com/macros/s/AKfycbyCFf3T_OP5KcXjgGXpmK9jqGLrP_lDrjsiXkaNXnMF67p_nctuy3qjisghfEUHmGSh/exec",
            storageKey: "rebelVelvetCart",
            placeholderImage: "https://placehold.co/800x1000/f1dfd8/6d1f2b?text=Rebel+Velvet",
        };

        const state = {
            products: [],
            cart: [],
            filter: "all",
        };

        const priceFormat = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });

        function formatPrice(amount) {
            return `${CONFIG.currency} ${priceFormat.format(Number(amount) || 0)}`;
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, (char) => ({
                "&": "&", "<": "<", ">": ">", '"': """, "'": "'"
            }[char]));
        }

        function fetchCatalog() {
            return new Promise((resolve) => {
                const callbackName = `rvCb_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
                const script = document.createElement("script");
                let finished = false;

                window[callbackName] = function(data) {
                    if (finished) return;
                    finished = true;
                    delete window[callbackName];
                    script.remove();
                    resolve(data && data.success ? data : null);
                };

                script.onerror = () => {
                    if (finished) return;
                    finished = true;
                    delete window[callbackName];
                    script.remove();
                    resolve(null);
                };

                script.src = `${CONFIG.catalogApi}?callback=${callbackName}&t=${Date.now()}`;
                document.body.appendChild(script);
            });
        }

        function renderProducts() {
            const grid = document.getElementById("products");
            if (!grid) return;

            if (!state.products.length) {
                grid.innerHTML = '<p>لا توجد منتجات متاحة حالياً.</p>';
                return;
            }

            grid.innerHTML = state.products.map(product => `
                <article class="product-card">
                    <img src="${escapeHtml(product.image || CONFIG.placeholderImage)}" alt="${escapeHtml(product.name)}" />
                    <h3 class="product-name">${escapeHtml(product.name)}</h3>
                    <p class="product-price">${formatPrice(product.price)}</p>
                    <button class="btn" onclick="alert('تمت الإضافة إلى السلة')">Add to bag</button>
                </article>
            `).join("");
        }

        async function init() {
            const data = await fetchCatalog();
            state.products = data && Array.isArray(data.catalog) ? data.catalog : [];
            renderProducts();
        }

        window.onload = init;
    </script>
</body>
</html>
